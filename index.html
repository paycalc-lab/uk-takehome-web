<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UK Take Home Web</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; max-width: 720px; }
    input, button { font-size: 16px; padding: 10px; }
    label { display:block; margin: 14px 0 6px; }
    .card { padding: 16px; border: 1px solid #ddd; border-radius: 10px; }
    .result { margin-top: 14px; font-weight: 700; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>UK take-home calculator.</h1>
<p>Check your take-home in seconds.</p>

  <p><small>Step 1: “Overtime clarity” with no backend — just a tiny input → output.</small></p>

  <div class="card">
    <label for="hours">Overtime hours</label>
    <input id="hours" type="number" min="0" step="0.25" value="0" />

    <label for="rate">Overtime rate (£/hour)</label>
    <input id="rate" type="number" min="0" step="0.01" value="0" />

    <div class="result" id="out">Overtime gross: £0.00 | Est. take-home (70%): £0.00
</div>
  </div>

  <script>
    const hoursEl = document.getElementById('hours');
    const rateEl  = document.getElementById('rate');
    const outEl   = document.getElementById('out');

    function money(n) {
      return (Number.isFinite(n) ? n : 0).toLocaleString('en-GB', {
        style: 'currency',
        currency: 'GBP'
      });
    }

    function update() {
      const hours = parseFloat(hoursEl.value) || 0;
      const rate  = parseFloat(rateEl.value)  || 0;
      const gross = hours * rate;
      const takeHome = gross * 0.68;
outEl.textContent = `Overtime gross: ${money(gross)} | Est. take-home (70%): ${money(takeHome)}`;

    }

    hoursEl.addEventListener('input', update);
    rateEl.addEventListener('input', update);
    update();
  </script>
</body>
</html>
