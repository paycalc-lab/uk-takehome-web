<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UK Pay Clarity (Lab)</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Inline favicon to avoid favicon.ico 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E%C2%A3%3C/text%3E%3C/svg%3E">
</head>
<body>
  <h1>UK pay clarity</h1>
  <p>Calm, accurate take-home. No fluff.</p>

  <form id="calcForm" class="card">
    <label for="salaryAnnual">Annual gross salary (£)</label>
    <input id="salaryAnnual" type="number" min="0" step="100" value="30000" />

    <label for="pensionPct">Pension % (salary sacrifice)</label>
    <input id="pensionPct" type="number" min="0" max="100" step="0.1" value="5" />

    <label for="region">Tax region</label>
    <select id="region">
      <option value="rUK" selected>England / Wales / NI</option>
      <option value="scotland">Scotland</option>
    </select>

    <details>
      <summary>+ Add overtime</summary>

      <label for="overtimeAnnual">Overtime (annual total £)</label>
      <input id="overtimeAnnual" type="number" min="0" step="100" value="0" />
      <p class="hint">V1: enter the total overtime you expect over a year (annualised).</p>
    </details>

    <button type="submit">Calculate</button>
  </form>

  <div class="card">
    <div class="result">
      <div class="kicker">Net monthly</div>
      <div id="netMonthly" class="big">£0.00</div>
    </div>

    <div class="result">
      <div class="kicker">Net weekly</div>
      <div id="netWeekly">£0.00</div>
    </div>

    <details>
      <summary>Show breakdown</summary>
      <div id="breakdown" class="breakdown"></div>
      <p class="hint">Student loan not included (V1).</p>
    </details>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
