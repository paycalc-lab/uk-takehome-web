<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UK Take Home Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>UK take-home calculator.</h1>
  <p>Check your take-home in seconds.</p>
  
<div class="card">
  <label for="salary">Annual salary (£)</label>
  <input id="salary" type="number" min="0" step="100" value="30000" />
</div>

  <div class="card">
    <label for="hours">Overtime hours (this month)</label>
    <input id="hours" type="number" min="0" step="0.25" value="0" />

    <label for="rate">Overtime rate (£/hour)</label>
    <input id="rate" type="number" min="0" step="0.01" value="0" />

    <div class="result" id="out">Overtime gross: £0.00 | Est. take-home (70%): £0.00</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
